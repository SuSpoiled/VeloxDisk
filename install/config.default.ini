; VeloxDisk 配置模板
; 引擎启动时自动加载本文件中所有非注释的 [task.<name>] 段。
; 取消示例段开头的分号并改成实际路径/容量即可启用。

; [task.demo]
; objects = D:\data\file.bin
; strategy = 2
; l1Bytes = 268435456
; l2Bytes = 4294967296
; l2Dir = D:\VeloxDiskData
; l2BaseName = demo
; blockSize = 65536
; deferWrite = 1
; deferSeconds = 10
; writeMode = 1
